# Alembic 配置（WP06 骨架）。
#
# 关键约束（C6 安全）：**本文件不含任何数据库 URL**。
# `sqlalchemy.url` 刻意留空，由 migrations/env.py 从环境变量
# REDNOTE_DATABASE_URL 读取。理由：
#   1) alembic.ini 会被提交进版本库，写 URL 等于把凭据写进版本历史；
#   2) 同一个迁移要在 dev / staging / prod 三个库上跑，URL 必须是运行时输入，
#      而不是构建时常量。写死在 ini 里会诱导人手工改 ini，进而产生
#      "迁移跑在了错误的库上"这类事故。
#
# 用法（在仓库根执行）：
#   export REDNOTE_DATABASE_URL='postgresql+psycopg://rednote@localhost:5432/postgres'
#   alembic -c migrations/alembic.ini upgrade head

[alembic]
# 迁移脚本目录。用 %(here)s（= 本文件所在目录）而不是相对 cwd 的路径，
# 这样从仓库任意位置调用都能正确解析。
script_location = %(here)s

# 版本文件的命名模板。
# 为什么不用 Alembic 默认的 `%%(rev)s_%%(slug)s`：默认模板只有短 rev，
# 在按时间排查"哪个迁移先上"时要额外查表。加日期前缀后，文件名本身就
# 携带时序信息，`ls migrations/versions/` 即按时间有序。
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# 时间戳统一用 UTC：多实例/多时区下，本地时间会让迁移顺序难以比对。
timezone = UTC

# 截断过长的 slug，避免文件名超长（部分文件系统 255 字节上限）。
truncate_slug_length = 40

# 关闭"启动时检测到新版本则自动改写 version_num"的行为。
# 生产库的版本必须由显式 `upgrade` 命令推进，不允许任何自动改写。
# （Alembic 文档称此为 "autogenerate 陷阱" 之一。）
revision_environment = false

# 把 migrations/versions 之外的所有目录都排除，避免误扫到业务代码。
# 同时排除 __pycache__，否则 .pyc 可能被当成版本文件。
version_path_separator = os

# ---------------------------------------------------------------------------
# 日志
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S