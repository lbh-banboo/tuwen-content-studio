# 供应链：actions 固定到 commit SHA（checkout v4 / setup-python v5），不用浮动 tag。
# checkout  = 11d5960a326750d5838078e36cf38b85af677262
# setup-python = a26af69be951a213d495a4c3e4e4022e16d87065
# Rednote 后端 CI —— 三道门
#
#   门 1  smoke      每次 push（任意分支）       health + contract，~10s，挡"根本跑不起来"
#   门 2  full       pull_request / push main   全量 pytest + 契约门禁，挡"改坏了别的包"
#   门 3  guard      push main（合并后）          cross_wp + regression 显式复跑 + 证据/一致性自检
#
# 约定（与本仓铁律一致）：
#   · pytest 不再加 -q：pyproject addopts 已有 -q，叠加成 -qq 会吞掉汇总行（ISS-24）
#   · 测试不 mock 数据库：services 起真 PG17 + pgvector，先建扩展再跑迁移
#     （WP21 迁移刻意不代建扩展，见 20260924_1502_7a4c1e93b6d2）
#   · 迁移、应用、测试三个 DSN 指向同一库，与本机默认口径一致（全量需在 postgres 库上跑）
#
# ⚠️ 2026-11-09：jobs.<job_id>.env 位置不提供 env 上下文。GitHub Actions 官方校验
#    对 `REDNOTE_*_DATABASE_URL: ${{ env.PG_DSN }}` 报
#    "Unrecognized named-value: 'env'"，整个 workflow 连 job 都起不来（0 job）。
#    三道门的 DSN 一律写字面值；顶层 env 不再放 PG_DSN，避免"看起来像唯一真值
#    来源、实际没有引用者"的假防线。改 DSN 必须同步下面 6 处。

name: backend-ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NO_PROXY: "*"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # ---------------------------------------------------------------- 门 1
  smoke:
    name: gate1-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # 字面值：jobs.<job_id>.env 不提供 env 上下文，见文件头说明。
      REDNOTE_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      REDNOTE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # cache: pip 刻意关闭：本仓 pyproject.toml 位于 services/backend/，
          # 仓库根没有 requirements.txt / pyproject.toml / setup.cfg，
          # setup-python 算不出缓存键会直接失败并跳过后续测试步骤。
      - name: install backend
        run: pip install -e "services/backend[dev]"
      - name: create pgvector extension
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: alembic upgrade head
        run: python -m alembic -c migrations/alembic.ini upgrade head
      - name: pytest -m smoke
        working-directory: services/backend
        run: python -m pytest -p no:cacheprovider -m smoke

  # ---------------------------------------------------------------- 门 2
  full:
    name: gate2-full
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # 字面值：jobs.<job_id>.env 不提供 env 上下文，见文件头说明。
      REDNOTE_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      REDNOTE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # cache: pip 刻意关闭：本仓 pyproject.toml 位于 services/backend/，
          # 仓库根没有 requirements.txt / pyproject.toml / setup.cfg，
          # setup-python 算不出缓存键会直接失败并跳过后续测试步骤。
      - name: install backend
        run: pip install -e "services/backend[dev]"
      - name: create pgvector extension
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: alembic upgrade head
        run: python -m alembic -c migrations/alembic.ini upgrade head
      - name: alembic single head (防分支并行导致 Multiple head)
        run: |
          heads=$(python -m alembic -c migrations/alembic.ini heads | grep -c "(head)")
          echo "alembic heads = $heads"
          test "$heads" -eq 1
      - name: contract gate (openapi.json 与代码同步)
        run: python tools/contracts/export_openapi.py --check
      - name: pytest full (排除 slow)
        working-directory: services/backend
        run: python -m pytest -p no:cacheprovider -m "not slow" -rfE

  # ---------------------------------------------------------------- 门 3
  guard:
    name: gate3-regression-guard
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: full
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # 字面值：jobs.<job_id>.env 不提供 env 上下文，见文件头说明。
      REDNOTE_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      REDNOTE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # cache: pip 刻意关闭：本仓 pyproject.toml 位于 services/backend/，
          # 仓库根没有 requirements.txt / pyproject.toml / setup.cfg，
          # setup-python 算不出缓存键会直接失败并跳过后续测试步骤。
      - name: install backend
        run: pip install -e "services/backend[dev]"
      - name: create pgvector extension
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: alembic upgrade head
        run: python -m alembic -c migrations/alembic.ini upgrade head
      - name: regression + cross_wp + slow（护栏显式复跑，slow 只在此门跑）
        working-directory: services/backend
        run: python -m pytest -p no:cacheprovider -m "regression or cross_wp or slow" -rfE
      - name: regression register 对账（登记册条目 == 带标记的测试）
        run: python tools/regression/check_register.py
      - name: evidence scripts self-check
        # 静态自检全部证据脚本（含 tools/m1/rerun_all_evidence.py 本身）。
        # 覆盖范围由磁盘决定（`tools/**/collect_wp*_evidence.py`），见 ISS-139。
        run: python tools/m1/check_evidence_scripts.py
      # ⚠️ `tools/m1/rerun_all_evidence.py`（收口第 11 步：真跑全部历史证据脚本）
      # **刻意不放进本门**，理由必须写下来（否则就是 ISS-95「声称有防线」的空白）：
      #   ① 它内含全量 pytest，本机实测约 30 分钟，放进 push 触发的门会让每次
      #      提交都等半小时，最终被人绕过 —— 防线变成仪式。
      #   ② 它要跑的是**历史包的证据再生成**，而本门已经在跑
      #      `regression or cross_wp or slow`（上游第 148 行）+ 契约门禁 +
      #      audit_consistency 的证据时效判据 —— 真被新包打破的等式判据
      #      在 cross_wp 标记里基本都会现形。
      #   ③ 因此它的定位是**收口时的强制手工步骤**，由 `check_evidence_scripts.py`
      #      保证它**本身没坏**、由 `audit_consistency.py` §5 保证**证据不过期**。
      # 结论：它不在本门里，但它的"没坏"与"跑过没"各有一条判据 —— 不是没人看着。
      - name: test DB isolation self-check（不许硬编码 DSN，ISS-108）
        run: python tools/quality/check_test_db_isolation.py
      # ⚠️ 依赖声明一致性（ISS-144 / WP-DEBT-01）**刻意挂在门 3 而不是门 1**，
      # 理由必须写下来（否则就是 ISS-95「声称有防线」的空白）：
      #   · 门 1/门 2 判的是"**能不能跑**"（进程存活 / 全量测试），
      #     而本判据判的是"**声明与代码是否一致**"——属合规自检，与门 3 定位同族
      #     （门 3 已在此处挂 `check_test_db_isolation.py` / `audit_consistency.py`）。
      #   · 它**纯静态、零数据库、秒级**，本可以放门 1；不放的原因是
      #     本仓的交付流是"一个工作包一个提交、直接推 main"，
      #     门 3 在 push main 后即执行 ⇒ 对真实流程是有效的。
      #     （若将来改为 PR-only 流程，应把它**同时**提到门 1/门 2。）
      - name: dependency declaration self-check（代码 import 的必须在 pyproject 声明）
        run: python tools/quality/check_dependency_declarations.py
      - name: dependency declaration 反向验证（把漏声明放回去，判据必须报红）
        run: python tools/quality/collect_dependency_declaration_reverse_evidence.py
      - name: dependency declaration code review evidence（三遍法，文档声称 = 待验证假设）
        run: python tools/quality/collect_dependency_declaration_code_review.py
      # ⚠️ 测试库可信度（ISS-145/146/147 / WP-DEBT-02）—— 三条判据 + 反向验证 + 三遍法。
      # 挂门 3 的理由与上一条同族（合规自检，非"能不能跑"）；另有一处**必须挂这里**的理由：
      #   · 判据 B（测试残留）与判据 C（迁移↔模型对账）都**需要真库**：
      #     B 要跑 pytest、C 要建临时库。门 1 的定位是"便宜且早"，放它会破坏那一定位。
      #   · 判据 C **自带 `pgvector` 扩展创建**（`_enable_vector`）⇒ 不依赖 runner 预装扩展。
      #   · 反向验证只跑 `--fast`（判据 A 的纯静态变异）——完整版要 ~10 分钟，留本机收口跑。
      # 注意：判据 B 在本门里跑的是**真 pytest**，若将来 CI 时间预算收紧，
      #      应把它降级为"仅本机收口步骤"，而**不是**删掉它（删掉 = ISS-95 的空白）。
      - name: test DB target self-check（默认 DSN 不许指向系统库，ISS-145）
        run: python tools/quality/check_test_database_target.py
      - name: migration↔model parity（迁移结构与模型结构全量对账，ISS-146）
        run: python tools/quality/check_migration_model_parity.py
      # ⚠️ ISS-79：`upgrade head` 一直被三道门覆盖，`downgrade` 却被**任何判据**覆盖过 ——
      #    CI 只跑 `upgrade head`，于是 WP11/WP15 的 `downgrade` 把跨包共用函数
      #    `rednote_reject_mutation()` 一起删掉、`alembic downgrade base` 直接
      #    `DependentObjectsStillExist`，两个大包过去而无人发现（ADR-11 的
      #    RPO ≤ 24h / RTO ≤ 8h 所依赖的"回滚链可用"因此是**无人守的空白**）。
      #    本步骤补上"回滚路径存在"这条机械判据，静态（扫描全部迁移禁 DROP 共用函数）
      #    + 动态（真库 `upgrade head → downgrade base → upgrade head` 往返）。
      #    挂门 3 的理由与上面 migration↔model parity 同族：两者都要建一次性临时库，
      #    属"重"操作，与门 1"便宜且早"的定位冲突（判据自带 `pgvector` 创建，不依赖 runner 预装）。
      - name: migration round-trip（回滚路径必须存在：升级→回退到 base→再升级，ISS-79）
        run: python tools/quality/check_migration_roundtrip.py
      # ⚠️ WP47：备份恢复演练。挂门 3 的理由与 migration round-trip 同族 ——
      #    它要 createdb ×2 + alembic upgrade head + pg_dump + pg_restore，属"重"操作。
      #    为什么必须进 CI：只有 `backup_pg.py` 脚本而没人真恢复一遍逐项比对，
      #    就是第 5 条纪律（ISS-143）说的"没跑与跑失败同形"。判据自带
      #    注入破坏反向验证（DROP 触发器 / 删行），不是"比对恒真"的绿灯。
      - name: backup-restore drill（备份必须能恢复出逐项相等的库，WP47）
        run: python tools/quality/check_backup_restore_drill.py
      # ⚠️ WP47④：队列对账判据的反向验证（异常矩阵第 ⑭ 项）。
      #    登记它的**实质理由**：判据本体的 6 条 `queue:*` 条目形态是
      #    "全绿时报出『队列逐列对账通过』"，而这一块**有过一次真实假绿** ——
      #    2026-10-07 首跑只造 users / version_nodes 两张表，四张队列表全 0 行，
      #    `0 == 0` 恒真，备份把队列内容全丢了照样报"行数相等"。
      #    判据在自己的队列表上犯了它 docstring 里写下的 ISS-115。
      #    ⇒ 光"跑一次绿了"不能证明这 6 条在干活，必须逐个注入破坏要求它们报红。
      #    廉价（只跑单文件 pytest，秒级），故紧跟本体。
      - name: queue-reconcile 反向验证（队列对账必须真会报红，WP47④）
        run: python tools/quality/collect_queue_reconcile_reverse_evidence.py
      # ⚠️ WP47 ⑤⑥：回滚演练。挂门 3 的理由与上面 backup-restore drill 同族 ——
      #    它要 createdb + alembic upgrade/downgrade + 把一个"注定失败的升级"
      #    真的跑一遍，并整份 copytree 迁移树到 /tmp 做 A/B（幕 6），属"重"操作。
      #    为什么必须进 CI：WP47 计划里写明"演练要真跑" —— 只有
      #    `check_rollback_drill.py` 脚本而没人真回退一次，就是第 5 条纪律
      #    （ISS-143）说的"没跑与跑失败同形"。判据自带**注入破坏的反向验证**：
      #    幕 2 删索引必须让指纹变、幕 6 翻转 `transaction_per_migration`
      #    必须让落点不同 —— 不是"比完相等"就绿的恒真式。
      #    与 backup-restore drill 的分工：那个证"备份能恢复"，这个证"升级失败
      #    能退回已知良好版本"（ADR-11 的 RTO ≤ 8h 所依赖的另一半）。
      - name: rollback drill（升级失败必须能回退到已知良好版本，WP47 ⑤⑥）
        run: python tools/quality/check_rollback_drill.py
      - name: test residue self-check（跑测试前后不得多出持久对象，ISS-147）
        run: python tools/quality/check_test_residue.py
      # ⚠️ 测试库数据体量（ISS-223 / WP-DEBT-05）——判据 B 只测结构残留，管不到
      #    "表还是那些表、但行数一直在涨"。接在判据 B 后面，正好度量那次全量
      #    pytest 留下的数据量。只读三个 count(*)，秒级，与门 3 的合规自检定位同族。
      - name: test data volume（无主根表行数不许无界累积，ISS-223）
        run: python tools/quality/check_test_data_volume.py
      - name: test data volume 反向验证（把错误实现放回去，判据必须报红）
        run: python tools/quality/collect_test_data_volume_reverse_evidence.py
      - name: test data volume code review evidence（三遍法）
        run: python tools/quality/collect_test_data_volume_code_review.py
      - name: test DB credibility 反向验证（把错误实现放回去，判据必须报红）
        run: python tools/quality/collect_test_db_credibility_reverse_evidence.py --fast
      - name: test DB credibility code review evidence（三遍法，文档声称 = 待验证假设）
        run: python tools/quality/collect_test_db_credibility_code_review.py
      - name: cross-doc consistency audit
        run: python tools/m1/audit_consistency.py
      # ⚠️ 审计 §4「文档声明的证据文件必须存在」的**反向验证**（2026-10-08 M5 新增）。
      #    触发事件：§4 的后缀白名单原先只有 `log` —— 于是文档里声明的 `.json`/`.jsonl`
      #    证据**从来没有被 §4 看过**，而 §4 一直报"全部存在"。
      #    「覆盖范围由后缀白名单（人写）决定」正是铁律 14 的形态：白名单一缩，
      #    判据跟着缩，且缩的过程**静默**（报告仍然是绿的）。本脚本把这条补上。
      #    为什么必须挂这里：
      #      · 它**纯静态、零数据库、秒级**（本机实测 ~0.7s），与门 3 的合规自检定位同族；
      #      · 它补的是 §4 **自己证明不了**的那半句 —— §4 只能证明"当前是绿的"，
      #        证明不了"违规时它抓得住"（ISS-95：声称有防线 vs 真的有防线）。
      #      · 13 条断言里含**成对证明**（注入一条假声明 → 必红；撤回 → 必回绿）
      #        与白名单三档"声明数严格递增"，**不是**"比完相等"的恒真式。
      #    ⚠️ 与 `check_all_exports.py` 一族不同，本判据**没有**三遍法
      #       `collect_*_code_review.py`：它核对的"文档声称"就是审计 §4 那段源码本身，
      #       已在上面那条步骤里被判（「不适用」写在这里，否则读 CI 的人会以为漏了）。
      - name: declared evidence reverse verification（把 §4 的错误实现放回去，判据必须报红）
        run: python tools/quality/collect_declared_evidence_reverse_evidence.py
      # ⚠️ 审计 §2b 的反向验证（WP47① / ISS-206）。**必须挂门 3**，理由同上：
      #    纯静态、零数据库、秒级；它守的是"判据自己的锚点没被收窄成死正则"。
      #    挂这里的真实理由：§2b 那条判据的**唯一失效方向是"越收越死"** ——
      #    每次假红都诱导人把锚再收一点，而"永不命中"的输出与"判过"完全同形
      #    （ISS-95 / ISS-115）。没有反向验证时，这条判据的演化方向是**朝着失效走**的。
      #    R④（删掉真声明整行 ⇒ 第 1 条来源命中数须归 0）是唯一能区分
      #    「锚得对」与「锚得死」的手段 —— 在真实工作区里这两者长得一模一样。
      - name: readme 声明锚点反向验证（收紧锚点不等于收成死正则）
        run: python tools/quality/collect_readme_decl_anchor_reverse_evidence.py
      # WP47② 告警规则（ADR-11 C6）。计划 §4.2 的验收原文是
      # 「告警规则 promtool check 通过」，但本机实测（2026-10-08）：
      #   $ promtool check rules <把指标名拼错的规则>
      #     SUCCESS: 6 rules found      EXIT=0
      # ⇒ promtool **只验 YAML 语法与表达式解析，不校验指标是否存在**；
      #    而 Prometheus 对"引用不存在的指标"也不报错（表达式静默返回空），
      #    告警永不触发且无任何日志。
