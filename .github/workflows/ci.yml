# 公开快照 CI —— 只验「这堆公开产物能不能装、能不能跑、有没有夹带不该公开的东西」。
#
# ⚠️ 为什么本仓没有内部研发仓的三道门（2026-11-09，根因留档，不许悄悄删）
#   本仓库是 `rednote-production` 的**脱敏白名单快照**，不是研发工作区。
#   原仓 `.github/workflows/ci.yml` 的三道门被白名单一起复制了进来，
#   但它的输入在公开快照里**根本不存在**：
#     · 门 2 `pytest -m "not slow"`：3208 用例里有内部 fixture 硬编码本机角色
#       与自建私有库，且 autouse 夹具无条件覆盖 DSN ⇒ 干净 runner 上必然
#       `role ... does not exist` / `database ... does not exist`。
#       本地新建干净私有库 + upgrade head 后实测：
#       3194 passed / 1 failed / 10 errors in 478s（见发布审计目录 06 号文件第八节）。
#       其中 1 failed 是脱敏把 `assert "<本机用户名>" not in got` 换成
#       `assert "rednote" not in got`，而该用例的库名参数就叫 `rednote_x_1`
#       ⇒ 恒假；10 errors 是 fixture 硬编码了本机角色。
#       两处已在本次提交中真修（按 URL 组成对账 / 基准 DSN 派生），
#       本地复跑 11 passed；但全量集仍含「必须存在自建私有库」的 fixture，
#       CI runner 只有一个 postgres 库 ⇒ 结构性不可绿。
#     · 门 3 的 40+ 条内部护栏：`evidence/**/*.log`（公开快照 0 个，
#       84 个 tools 脚本引用它）、内部文档声明、离线 wheelhouse 真构建、
#       docker daemon、私有库 createdb —— 输入全被移除，或根本不该在公开仓出网。
#   把这套 CI 原样留着不跑 = ISS-95「声称有防线」；跑 = 永久红，
#   且红的原因与公开产物质量无关。原仓无 remote，它从未在干净 Actions
#   环境验证过 —— 公开后第一次真跑才把上述旧伤全部暴露出来。
#   ⇒ 按本仓纪律，「不适用」必须写进 CI 文件本身，而不是悄悄删掉。
#   完整的内部三道门仍保存在内部研发仓 `.github/workflows/ci.yml`，
#   未开源、未删除、未改写。
#
# 本 workflow 真跑的八件事（每一项都与公开快照的真实内容对应）：
#   1 editable 安装依赖      2 起 PG17 + pgvector service
#   3 alembic upgrade head   4 alembic single head
#   5 openapi 契约门禁       6 pytest -m smoke（真连库）
#   7 公开快照不变式判据     8 该判据的成对反向验证（注入违规必红）
# 仓库外的 `verify_opensource_snapshot.py` 另守 PII / 中性身份 / 三方对账，
# 不把「要找什么」的清单公开进仓库。
#
# 供应链：actions 固定到 commit SHA，不用浮动 tag。
#   checkout     = 11d5960a326750d5838078e36cf38b85af677262
#   setup-python = a26af69be951a213d495a4c3e4e4022e16d87065
# ⚠️ 2026-11-09：jobs.<job_id>.env 位置不提供 env 上下文。GitHub Actions
#    官方校验对 `REDNOTE_*_DATABASE_URL: ${{ env.PG_DSN }}` 报
#    "Unrecognized named-value: 'env'"，整个 workflow 连 job 都起不来（0 job）。
#    DSN 一律写字面值；顶层 env 不再放 PG_DSN，避免「看起来像唯一真值来源、
#    实际没有引用者」的假防线。`steps.with` 里的 `${{ env.PYTHON_VERSION }}`
#    是唯一合法用法，由 `check_public_snapshot.py` 的 G09 机械守着。

name: public-snapshot-ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NO_PROXY: "*"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  verify:
    name: public-snapshot-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # 字面值：jobs.<job_id>.env 不提供 env 上下文，见文件头说明。
      REDNOTE_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      REDNOTE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # cache: pip 刻意关闭：仓库根没有 requirements.txt / pyproject.toml，
          # setup-python 算不出缓存键会直接失败并跳过后续步骤。
      - name: install backend
        run: pip install -e "services/backend[dev]"
      - name: create pgvector extension
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: alembic upgrade head
        run: python -m alembic -c migrations/alembic.ini upgrade head
      - name: alembic single head
        run: |
          heads=$(python -m alembic -c migrations/alembic.ini heads | grep -c "(head)")
          echo "alembic heads = $heads"
          test "$heads" -eq 1
      - name: contract gate (openapi.json 与代码同步)
        run: python tools/contracts/export_openapi.py --check
      - name: pytest -m smoke
        working-directory: services/backend
        run: python -m pytest -p no:cacheprovider -m smoke
      - name: public snapshot invariants
        run: python tools/quality/check_public_snapshot.py
      - name: public snapshot 判据反向验证（注入违规必红，撤回回绿）
        run: python tools/quality/check_public_snapshot.py --self-test
