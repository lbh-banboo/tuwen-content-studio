# rednote-production 反向代理配置（WP46 ①，ADR-11 C8）
#
# 挂载位置：docker-compose.yml 的 gateway 服务把本目录只读挂到 /etc/nginx/conf.d/。
#
# ⚠️ **本文件只有 HTTP，没有 HTTPS**。不是忘了：
#   HTTPS 终结需要内部域名 + 内部 CA 签发的证书（ADR-11:36 / :57 的 E2），
#   而 E2 **未落地**。此处若写一个假的 ssl_certificate 路径，`up -d` 会在
#   「证书文件不存在」上失败 —— 那个错误**掩盖**真正的缺口（E2 没到位），
#   并且会让人以为「配好了只是文件没放」。
#   ⇒ 证书到位后要加的那一段写在文件末尾注释里，**不提前写进生效配置**。
#
# ⚠️ 本文件在任何环境**未经验证**：本机 Docker daemon 不可达（见 README §0），
#   nginx 的 `-t` 语法检查也跑不了（本机无 nginx 二进制，实测 `command -v nginx` 无命中）。
#   判据只能核对「配置里没有外网 origin、上游指向两个 API 实例」这种形态层事实。

upstream rednote_api {
    # ADR-11 C8：双 API 实例。least_conn 而不是默认 round-robin ——
    # 本系统的请求耗时差异大（导出/解析是长任务），轮询会把长任务堆到同一实例。
    least_conn;
    server api-1:9090 max_fails=3 fail_timeout=15s;
    server api-2:9090 max_fails=3 fail_timeout=15s;
}

server {
    listen 80;
    # [待核实: E2] server_name 应为内部域名。未定之前用 _ 兜住所有 Host。
    server_name _;

    # 上传体积上限：解析链路要收 docx/pdf/xlsx。
    # [待核实] 具体上限需与 WP17 的媒体体积口径对齐，这里给一个保守值而不是 0（不限）。
    client_max_body_size 64m;

    # ---------------------------------------------------------------------
    # 运维面：**不代理**。
    # /metrics 与 /healthz /readyz 刻意不在这里开口 —— ADR-11 C6 把「仅运维面可达」
    # 定为网关职责（OP-191，🔴 P0）。本文件的做法是**不给用户面任何入口**，
    # 运维面另由内网网关/跳板直连 data 网。
    # ⚠️ 这**不等于**「已经做到仅运维面可达」：OP-191 的关闭条件是
    #   「从外网实测一次 /metrics 应返回 403/404 而非 200」，那条回执只能在内网取。
    # ---------------------------------------------------------------------
    location = /metrics { return 404; }

    location / {
        proxy_pass http://rednote_api;
        proxy_http_version 1.1;

        # correlation id：WP47① 的 requestId 链路。网关层生成而不是只依赖应用层，
        # 是为了让「请求根本没到应用」这类故障也有 id 可查。
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长任务（导出/解析）需要比默认 60s 更长的读超时。
        # [待核实] 实际上限需与 WP50 的发布口径对齐。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ---------------------------------------------------------------------------
