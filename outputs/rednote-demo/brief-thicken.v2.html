<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#05040a" />
<title>确认加厚输出与版本规则 · Rednote 内容生产 AI Native 系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="components.css" />
</head>
<body>
<div class="grid-bg"></div>

<div class="shell">
  <aside class="sidebar"></aside>

  <div class="main">
    <header class="topbar"></header>

    <div class="canvas">
      <div class="page-head">
        <div id="bt-head">
          <h1 class="page-title">正在读取加厚数据…</h1>
          <p class="page-desc">GET /projects/{id}/brief</p>
        </div>
        <div class="page-head-actions">
          <a class="btn btn-ghost" data-keep-id href="brief.v2.html"><i class="fa-solid fa-arrow-left"></i>上一步</a>
          <a class="btn btn-primary" data-keep-id href="research.v2.html">下一步：项目研究 <i class="fa-solid fa-arrow-right"></i></a>
        </div>
      </div>

      <div class="grid g4" id="bt-metrics" data-stagger></div>

      <div class="grid g-3-2">
        <div id="bt-suggestions" aria-live="polite"></div>
        <div class="col" style="gap:14px">
          <div id="bt-prereq" aria-live="polite"></div>
          <div id="bt-issues" aria-live="polite"></div>
          <div id="bt-rules"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  window.REDNOTE_API_BASE = '/api/v1';
</script>
<script src="api.js"></script>
<script src="render/brief-thicken.js"></script>
<script src="app.js"></script>
<script>
  initPage({ active: 'brief-thicken', crumb: ['项目中心', 'Brief 加厚'] });

  /* 挂载层：取数 → 纯函数 → innerHTML。可测逻辑全部在 render/brief-thicken.js。 */
  (function () {
    'use strict';
    var API = window.RednoteAPI, R = window.RednoteRender.briefThicken;
    var head = document.getElementById('bt-head'), metrics = document.getElementById('bt-metrics');
    var suggestions = document.getElementById('bt-suggestions'), prereq = document.getElementById('bt-prereq');
    var issues = document.getElementById('bt-issues'), rules = document.getElementById('bt-rules');
    var keepId = document.querySelectorAll('[data-keep-id]');
    function renderAll(project, brief) {
      head.innerHTML = R.renderHead(project, brief);
      metrics.innerHTML = R.renderMetrics(brief);
      suggestions.innerHTML = R.renderSuggestionsCard(brief);
      prereq.innerHTML = R.renderPrereqCard(brief);
      issues.innerHTML = R.renderIssuesCard(brief);
      rules.innerHTML = R.renderRulesCard();
    }
    async function load() {
      head.innerHTML = '<div><h1 class="page-title">正在读取加厚数据…</h1><p class="page-desc">GET /projects/{id}/brief</p></div>';
      [metrics, suggestions, prereq, issues].forEach(function (el) { el.innerHTML = R.renderCardLoading('正在读取 Brief 数据…'); });
      try {
        var id = new URLSearchParams(window.location.search).get('id');
        if (!id) { var list = await API.page('/projects', { limit: 100 }); id = list.items.length ? list.items[0].id : ''; }
        if (!id) throw { code: 'RESOURCE_NOT_FOUND', message: '没有可访问项目。' };
        keepId.forEach(function (a) { a.href = a.getAttribute('href').split('?')[0] + '?id=' + encodeURIComponent(id); });
        var res = await Promise.all([API.get('/projects/' + encodeURIComponent(id)), API.get('/projects/' + encodeURIComponent(id) + '/brief')]);
        renderAll(res[0], res[1]);
      } catch (err) {
        head.innerHTML = '<div><h1 class="page-title">加厚数据读取失败</h1><p class="page-desc">请检查后端与项目 ID 后重试。</p></div>';
        metrics.innerHTML = '';
        suggestions.innerHTML = R.renderCardError(err);
        prereq.innerHTML = '';
        issues.innerHTML = '';
      }
    }
    suggestions.addEventListener('click', function (e) {
      if (e.target.closest('[data-action="retry"]')) load();
    });
    load();
  })();
</script>
</body>
</html>
