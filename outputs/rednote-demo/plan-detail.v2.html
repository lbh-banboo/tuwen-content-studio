<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#05040a" />
<title>复核逐行决策问题与实验分组 · Rednote 内容生产 AI Native 系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="components.css" />
</head>
<body>
<div class="grid-bg"></div>

<div class="shell">
  <aside class="sidebar"></aside>

  <div class="main">
    <header class="topbar"></header>

    <div class="canvas">
      <div class="page-head">
        <div id="pd-head">
          <h1 class="page-title">正在读取逐行计划…</h1>
          <p class="page-desc">GET /projects/{id}/plan-draft</p>
        </div>
        <div class="page-head-actions">
          <a class="btn btn-ghost" data-keep-id href="trial-plan.v2.html"><i class="fa-solid fa-arrow-left"></i>上一步</a>
          <a class="btn btn-primary" href="content-feedback.html">下一步：试产反馈 <i class="fa-solid fa-arrow-right"></i></a>
        </div>
      </div>

      <div class="grid g4" id="pd-metrics" data-stagger></div>

      <div class="grid g-3-2">
        <div class="col" style="gap:14px">
          <div id="pd-rows" aria-live="polite"></div>
          <div id="pd-pairings" aria-live="polite"></div>
        </div>
        <div class="col" style="gap:14px">
          <div id="pd-allocations" aria-live="polite"></div>
          <div id="pd-experiment"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  window.REDNOTE_API_BASE = '/api/v1';
</script>
<script src="api.js"></script>
<script src="render/shared.js"></script>
<script src="render/plan-detail.js"></script>
<script src="app.js"></script>
<script>
  initPage({ active: 'plan-detail', crumb: ['项目中心', '逐行计划'] });

  /* 挂载层：取数 → 纯函数 → innerHTML。可测逻辑全部在 render/plan-detail.js。 */
  (function () {
    'use strict';
    var API = window.RednoteAPI, R = window.RednoteRender.planDetail;
    var head = document.getElementById('pd-head'), metrics = document.getElementById('pd-metrics');
    var rows = document.getElementById('pd-rows'), pairings = document.getElementById('pd-pairings');
    var allocations = document.getElementById('pd-allocations'), experiment = document.getElementById('pd-experiment');
    var keepId = document.querySelectorAll('[data-keep-id]');
    var regions = [metrics, rows, pairings, allocations];
    function renderAll(project, draft) {
      head.innerHTML = R.renderHead(project, draft);
      metrics.innerHTML = R.renderMetrics(draft);
      rows.innerHTML = R.renderRowsCard(draft);
      pairings.innerHTML = R.renderPairingsCard(draft);
      allocations.innerHTML = R.renderAllocationsCard(draft);
      experiment.innerHTML = R.renderExperimentCard();
    }
    async function load() {
      head.innerHTML = '<div><h1 class="page-title">正在读取逐行计划…</h1><p class="page-desc">GET /projects/{id}/plan-draft</p></div>';
      regions.forEach(function (el) { el.innerHTML = R.renderCardLoading('正在读取计划草稿…'); });
      try {
        var id = new URLSearchParams(window.location.search).get('id');
        if (!id) { var list = await API.page('/projects', { limit: 100 }); id = list.items.length ? list.items[0].id : ''; }
        if (!id) throw { code: 'RESOURCE_NOT_FOUND', message: '没有可访问项目。' };
        keepId.forEach(function (a) { a.href = a.getAttribute('href').split('?')[0] + '?id=' + encodeURIComponent(id); });
        var base = '/projects/' + encodeURIComponent(id);
        var res = await Promise.all([API.get(base), API.get(base + '/plan-draft')]);
        renderAll(res[0], res[1]);
      } catch (err) {
        head.innerHTML = '<div><h1 class="page-title">逐行计划读取失败</h1><p class="page-desc">请检查后端与项目 ID 后重试。</p></div>';
        regions.forEach(function (el) { el.innerHTML = R.renderCardError(err); });
      }
    }
    rows.addEventListener('click', function (e) {
      if (e.target.closest('[data-action="retry"]')) load();
    });
    load();
  })();
</script>
</body>
</html>
