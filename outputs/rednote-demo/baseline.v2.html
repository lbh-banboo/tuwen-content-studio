<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#05040a" />
<title>确认生产基线快照与组装顺序 · Rednote 内容生产 AI Native 系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="components.css" />
</head>
<body>
<div class="grid-bg"></div>

<div class="shell">
  <aside class="sidebar"></aside>

  <div class="main">
    <header class="topbar"></header>

    <div class="canvas">
      <div class="page-head">
        <div id="bl-head">
          <h1 class="page-title">正在读取生产基线…</h1>
          <p class="page-desc">GET /projects/{id}/baselines</p>
        </div>
        <div class="page-head-actions">
          <a class="btn btn-ghost" data-keep-id href="info-review.v2.html"><i class="fa-solid fa-arrow-left"></i>上一步</a>
          <a class="btn btn-primary" data-keep-id href="claims.v2.html">下一步：可用主张 <i class="fa-solid fa-arrow-right"></i></a>
        </div>
      </div>

      <div class="grid g4" id="bl-metrics" data-stagger></div>

      <div class="grid g-3-2">
        <div class="col" style="gap:14px">
          <div id="bl-list" aria-live="polite"></div>
          <div id="bl-prereq" aria-live="polite"></div>
        </div>
        <div class="col" style="gap:14px">
          <div id="bl-readiness" aria-live="polite"></div>
          <div id="bl-summary" aria-live="polite"></div>
        </div>
      </div>

      <div id="bl-assembly"></div>
    </div>
  </div>
</div>

<script>
  window.REDNOTE_API_BASE = '/api/v1';
</script>
<script src="api.js"></script>
<script src="render/baseline.js"></script>
<script src="app.js"></script>
<script>
  initPage({ active: 'baseline', crumb: ['项目中心', '生产基线'] });

  /* 挂载层：取数 → 纯函数 → innerHTML。可测逻辑全部在 render/baseline.js。 */
  (function () {
    'use strict';
    var API = window.RednoteAPI, R = window.RednoteRender.baseline;
    var head = document.getElementById('bl-head'), metrics = document.getElementById('bl-metrics');
    var list = document.getElementById('bl-list'), prereq = document.getElementById('bl-prereq');
    var readiness = document.getElementById('bl-readiness'), summary = document.getElementById('bl-summary');
    var assembly = document.getElementById('bl-assembly'), keepId = document.querySelectorAll('[data-keep-id]');
    var regions = [metrics, list, prereq, readiness, summary];
    function renderAll(project, draft, baselines) {
      head.innerHTML = R.renderHead(project, draft, baselines);
      metrics.innerHTML = R.renderMetrics(draft, baselines);
      list.innerHTML = R.renderBaselinesCard(baselines);
      prereq.innerHTML = R.renderCreatePrereqCard(draft);
      readiness.innerHTML = R.renderReadinessCard(draft);
      summary.innerHTML = R.renderDraftSummaryCard(draft);
      assembly.innerHTML = R.renderAssemblyCard();
    }
    async function load() {
      head.innerHTML = '<div><h1 class="page-title">正在读取生产基线…</h1><p class="page-desc">GET /projects/{id}/baselines</p></div>';
      regions.forEach(function (el) { el.innerHTML = R.renderCardLoading('正在读取基线数据…'); });
      try {
        var id = new URLSearchParams(window.location.search).get('id');
        if (!id) { var projects = await API.page('/projects', { limit: 100 }); id = projects.items.length ? projects.items[0].id : ''; }
        if (!id) throw { code: 'RESOURCE_NOT_FOUND', message: '没有可访问项目。' };
        keepId.forEach(function (a) { a.href = a.getAttribute('href').split('?')[0] + '?id=' + encodeURIComponent(id); });
        var base = '/projects/' + encodeURIComponent(id);
        var res = await Promise.all([API.get(base), API.get(base + '/information-draft'), API.page(base + '/baselines', { limit: 100 })]);
        renderAll(res[0], res[1], res[2].items);
      } catch (err) {
        head.innerHTML = '<div><h1 class="page-title">生产基线读取失败</h1><p class="page-desc">请检查后端与项目 ID 后重试。</p></div>';
        regions.forEach(function (el) { el.innerHTML = R.renderCardError(err); });
        assembly.innerHTML = '';
      }
    }
    list.addEventListener('click', function (e) {
      if (e.target.closest('[data-action="retry"]')) load();
    });
    load();
  })();
</script>
</body>
</html>
