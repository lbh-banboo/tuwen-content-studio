<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#05040a" />
<title>工作台 · Rednote 内容生产 AI Native 系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="components.css" />
</head>
<body>
<div class="grid-bg"></div>

<div class="shell">
  <aside class="sidebar"></aside>

  <div class="main">
    <header class="topbar"></header>

    <div class="canvas">
      <div class="page-head">
        <div>
          <h1 class="page-title">工作台</h1>
          <p class="page-desc">待办、可见项目与近期动态的实时视图 · 数据源 GET /work-items · GET /projects · GET /audit-events</p>
        </div>
        <div class="page-head-actions">
          <a class="btn btn-ghost" href="projects.v2.html"><i class="fa-solid fa-folder-open"></i>全部项目</a>
          <a class="btn btn-primary" href="brief.html"><i class="fa-solid fa-plus"></i>新建项目</a>
        </div>
      </div>

      <div class="grid g-3-2">
        <div class="col" style="gap:14px">
          <div id="wb-metrics" class="grid g3" data-stagger></div>

          <section class="card">
            <div class="card-head">
              <span class="card-title">待办</span>
              <span class="card-sub">GET /work-items · 当前成员待办</span>
            </div>
            <div id="wb-workitems" aria-live="polite"></div>
          </section>

          <section class="card">
            <div class="card-head">
              <span class="card-title">项目</span>
              <span class="card-sub">GET /projects · 当前账号可见</span>
              <div class="card-head-actions">
                <a class="btn btn-sm btn-ghost" href="projects.v2.html">全部项目</a>
              </div>
            </div>
            <div id="wb-projects" aria-live="polite"></div>
          </section>
        </div>

        <div class="col" style="gap:14px">
          <section class="card">
            <div class="card-head">
              <span class="card-title">近期动态</span>
              <span class="card-sub">GET /audit-events · 最近 8 条</span>
            </div>
            <div class="card-body" id="wb-activity" aria-live="polite"></div>
          </section>

          <div class="note note-info">
            <i class="fa-solid fa-circle-info"></i>
            <div>
              <b>动态口径：</b>GET /events 是 SSE 实时事件流（无历史列表），本页「近期动态」改读 GET /audit-events；
              两者都只展示接口真实返回，不补造记录。
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  window.REDNOTE_API_BASE = '/api/v1';
</script>
<script src="api.js"></script>
<script src="render/workbench.js"></script>
<script src="app.js"></script>
<script>
  initPage({ active: 'workbench', crumb: ['Rednote 系统', '工作台'] });

  /* 挂载层：取数 → 纯函数 → innerHTML。可测逻辑全部在 render/workbench.js。 */
  (function () {
    'use strict';
    var API = window.RednoteAPI;
    var R = window.RednoteRender.workbench;
    var els = {
      metrics: document.getElementById('wb-metrics'),
      items: document.getElementById('wb-workitems'),
      projects: document.getElementById('wb-projects'),
      activity: document.getElementById('wb-activity')
    };

    function load() {
      els.metrics.innerHTML = R.renderBlockLoading('读取工作台指标…');
      els.items.innerHTML = R.renderBlockLoading('读取待办…');
      els.projects.innerHTML = R.renderBlockLoading('读取项目…');
      els.activity.innerHTML = R.renderBlockLoading('读取动态…');
      Promise.allSettled([
        API.page('/work-items', { limit: 100 }),
        API.page('/projects', { limit: 100 }),
        API.page('/audit-events', { limit: 8 })
      ]).then(function (rs) {
        var items = rs[0].status === 'fulfilled' ? rs[0].value.items : null;
        var projects = rs[1].status === 'fulfilled' ? rs[1].value.items : null;
        var events = rs[2].status === 'fulfilled' ? rs[2].value.items : null;
        var byId = R.projectIndex(projects || []);
        els.metrics.innerHTML = items && projects
          ? R.renderMetrics({ workItems: items, projects: projects, events: events })
          : R.renderBlockError(rs[0].reason || rs[1].reason);
        els.items.innerHTML = items ? R.renderWorkItems(items, byId) : R.renderBlockError(rs[0].reason);
        els.projects.innerHTML = projects ? R.renderProjectsTable(projects) : R.renderBlockError(rs[1].reason);
        els.activity.innerHTML = events ? R.renderActivity(events, byId) : R.renderBlockError(rs[2].reason);
      });
    }

    document.querySelector('.canvas').addEventListener('click', function (e) {
      if (e.target.closest('[data-action="retry"]')) load();
    });

    load();
  })();
</script>
</body>
</html>
